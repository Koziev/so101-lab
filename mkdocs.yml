site_name: SO-101 Lab
site_description: Experiments in affordable robotics and Physical AI with the SO-101
site_author: Ilya Koziev
site_url: https://koziev.github.io/so101-lab/

repo_name: Koziev/so101-lab
repo_url: https://github.com/Koziev/so101-lab
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_url_format: "{date}/{slug}"
      archive: true
      categories: true
      pagination: true
      pagination_per_page: 10

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Koziev/so101-lab

copyright: Copyright &copy; Ilya Koziev

nav:
  - Home: index.md
  - Getting started:
      - Project overview: getting-started/overview.md
      - Hardware overview: getting-started/hardware.md
      - Software setup: getting-started/software-setup.md
  - Assembly:
      - 3D printing: assembly/3d-printing.md
      - Mechanical assembly: assembly/mechanical-assembly.md
      - Electronics and wiring: assembly/electronics.md
      - Calibration: assembly/calibration.md
  - Experiments:
      - Overview: experiments/index.md
      - Teleoperation: experiments/teleoperation.md
      - Simulation: experiments/simulation.md
      - Autonomous manipulation: experiments/autonomous-manipulation.md
  - Blog:
      - blog/index.md
  - Resources:
      - Repository guide: resources/repository-guide.md
